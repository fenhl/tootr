<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#546e7a">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOoTR</title>
  </head>
  <body scroll="no">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      var idleTime = 0;
      var waitTime = 0;

      function autoscroll() {
        if (document.body.classList.contains('stream') && document.getElementById('globalEntranceMenuElement') === null) {
          if (idleTime > 300) { // 10 seconds
            let scrollContainer = document.getElementById('worldScrollContainer');
            var prevScrollY = -20 - scrollContainer.children[0].getBoundingClientRect().top;
            if (waitTime >= 0 || prevScrollY > 0) {
              scrollContainer.scrollBy(0, 1);
              if (-20 - scrollContainer.children[0].getBoundingClientRect().top == prevScrollY) {
                if (waitTime >= window.innerHeight / 2) {
                  scrollContainer.scrollTo(0, 0);
                  waitTime = -window.innerHeight / 2;
                } else {
                  waitTime += 1;
                }
              } else {
                waitTime = 0;
              }
            } else {
              waitTime += 1;
            }
          } else {
            idleTime += 1;
          }
        }
      }

      function resetTimer() {
        idleTime = 0;
      }

      setInterval(autoscroll, 32);
      document.onclick = resetTimer;
      document.addEventListener('DOMMouseScroll', resetTimer);
    </script>
  </body>
</html>
